name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorise le job de déploiement à publier sur GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Installation de Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
        env:
          # `vars.VITE_BASE_PATH` permet de surcharger le chemin (domaine
          # personnalisé ou dépôt `<user>.github.io`). Sinon : /<nom-du-depot>/
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
          # URL du Web App Apps Script (Google Sheets backend).
          # À définir dans : Settings → Secrets and variables → Actions → New repository secret
          # Nom : VITE_API_URL  |  Valeur : https://script.google.com/macros/s/.../exec
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparation de l'artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
